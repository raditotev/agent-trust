# Local development stack. The serving stack is docker-compose.prod.yml.
#
# SECURITY: Set POSTGRES_PASSWORD and REDIS_PASSWORD before running.
# Example: POSTGRES_PASSWORD=secure_random_password docker compose up -d
#
# The project name is explicit and distinct from the prod stack's `agent-trust`.
# Without it both files derive the name from the directory, and each stack treats
# the other's containers as orphans — `up` on one offers to remove the other's
# database. Scripts that need to find a container should match on the
# `com.docker.compose.project` label, never on the container name.
name: agent-trust-dev

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_trust}
      POSTGRES_USER: ${POSTGRES_USER:-agent_trust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agent_trust}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-changeme}']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  agent-trust:
    build: .
    ports:
      - '8140:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_trust}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-agent_trust}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      ENVIRONMENT: production
      AUTH_PROVIDER: both
      MCP_TRANSPORT: streamable-http
      MCP_PORT: ${MCP_PORT:-8000}
      JSON_LOGS: 'true'
      LOG_LEVEL: INFO
      SIGNING_KEY_PATH: /app/keys/service.key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys
    restart: unless-stopped

  worker:
    build: .
    command: ['uv', 'run', 'python', 'scripts/run_worker.py']
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_trust}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-agent_trust}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      SIGNING_KEY_PATH: /app/keys/service.key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys
    restart: unless-stopped

# Prometheus and Grafana used to live here. They are now the shared observability
# stack's job (~/Projects/observability): one Grafana at logs.radi.pro, one
# Prometheus, one Loki for every service on this machine. This project owns only
# its dashboard, in monitoring/grafana/dashboards/, which that stack mounts.
volumes:
  postgres_data:
  redis_data:
